<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkMath - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">

            <header class="login-header">
                <h1 class="brand-title">InkMath</h1>
                <p class="brand-subtitle">Plataforma Educativa de Matemática</p>
            </header>

            <form id="loginForm" class="login-form" novalidate>

                <div class="form-group">
                    <label for="emailInput" class="form-label">Correo Electrónico</label>
                    <input type="email"
                           id="emailInput"
                           class="form-control"
                           placeholder="ejemplo@correo.com"
                           required>
                    <span class="error-text" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="passwordInput" class="form-label">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password"
                               id="passwordInput"
                               class="form-control"
                               placeholder="••••••••"
                               required>
                        <button type="button" class="btn-toggle-pass" id="btnTogglePass" aria-label="Mostrar u ocultar contraseña">
                            <!-- Icono referencia: icons/bx-eye-slash.svg -->
                            <img id="imgEyeIcon" src="icons/bx-eye-slash.svg" alt="Ocultar contraseña" class="icon-svg">
                        </button>
                    </div>
                    <span class="error-text" id="passwordError"></span>
                </div>

                <div class="form-actions">
                    <a href="#" class="link-forgot">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>

            </form>

            <footer class="login-footer">
                <p>¿No tienes una cuenta? <a href="registro.html" id="linkRegister">Regístrate aquí</a></p>
            </footer>

        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
