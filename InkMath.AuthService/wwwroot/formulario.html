<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00182E">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://docs.google.com https://accounts.google.com; base-uri 'self'; form-action 'self'">
    <title>InkMath - Tu opinión</title>
    <link rel="stylesheet" href="css/theme.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
            background: var(--color-bg-body);
            color: var(--color-text-dark);
            font-family: var(--font-base);
        }

        .card {
            width: 100%;
            max-width: 760px;
            background: var(--color-surface-white);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 16px 20px;
        }

            .header h1 {
                font-size: 1.25rem;
                font-weight: 700;
                color: var(--color-brand-dark);
            }

            .header p {
                font-size: 0.85rem;
                font-weight: 500;
                color: var(--color-text-muted);
            }

        /* Botón con borde inferior grueso, igual que los del juego */
        .btn-3d {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--color-brand-primary);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border: none;
            border-bottom: 4px solid var(--color-brand-primary-hover);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.05s ease;
        }

            .btn-3d:hover {
                filter: brightness(1.06);
            }

            .btn-3d:active {
                transform: translateY(3px);
                border-bottom-width: 1px;
            }

            .btn-3d:focus-visible {
                outline: 3px solid var(--color-brand-primary);
                outline-offset: 3px;
            }

            .btn-3d img {
                width: 20px;
                height: 20px;
                filter: brightness(0) invert(1);
            }

        .form-card {
            flex: 1;
            min-height: 60vh;
            overflow: hidden;
        }

            .form-card iframe {
                display: block;
                width: 100%;
                height: 100%;
                min-height: 60vh;
                border: 0;
            }

        @media (max-width: 480px) {
            .header {
                padding: 14px;
            }

                .header .btn-3d {
                    width: 100%;
                    justify-content: center;
                }
        }
    </style>
</head>
<body>

    <header class="card header">
        <div>
            <h1>Cuéntanos tu experiencia</h1>
            <p>Tu opinión nos ayuda a mejorar InkMath.</p>
        </div>
        <a href="/juego.html" class="btn-3d">
            <img src="/icons/bx-gaming.svg" alt="" width="20" height="20">
            Volver al juego
        </a>
    </header>

    <main class="card form-card">
        <iframe title="Formulario de retroalimentación"
                src="https://docs.google.com/forms/d/e/1FAIpQLSeEvkbNbZ04bO-fquvyUEruNUN6rwMXtkWOEcUnJH1LVqg3Gw/viewform?embedded=true"
                sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                referrerpolicy="no-referrer"
                loading="lazy">
            Cargando…
        </iframe>
    </main>

</body>
</html>
