<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkMath - Dashboard Provisional</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #edf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #2b6cb0;
            margin-bottom: 12px;
        }

        p {
            color: #4a5568;
            margin-bottom: 24px;
            font-size: 16px;
        }

        .btn-logout {
            padding: 10px 20px;
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Bienvenido a InkMath!</h1>
        <p id="welcomeMsg">Cargando datos del usuario...</p>
        <p>Sesión autenticada correctamente en la Web API (.NET 8).</p>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        const nombre = sessionStorage.getItem('usuarioNombre');
        const id = sessionStorage.getItem('usuarioId');

        if (!nombre || !id) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeMsg').innerText = `Hola, ${nombre} (ID de usuario: ${id}).`;
        }

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
