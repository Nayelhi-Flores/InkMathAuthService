<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Aulas - InkMath</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/aulas.css">
    <script src="js/layout.js" defer></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar"></aside>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="breadcrumb">
                    <span class="bc-muted">Aulas</span>
                    <span class="bc-separator">&gt;</span>
                    <span class="bc-active">Gestor de Aulas</span>
                </div>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name" id="profileName">Cargando...</span>
                        <span class="user-role">-</span>
                    </div>
                    <div class="user-avatar" id="profileInitials">--</div>
                    <button class="btn-notification" aria-label="Notificaciones">
                        <img src="icons/bx-bell.svg" alt="Notificaciones">
                    </button>
                </div>
            </header>

            <main class="content-body">
                <div class="page-header">
                    <div class="title-section">
                        <h1>GESTOR DE AULAS</h1>
                        <p class="subtitle">Cree y configure espacios seguros de diversión y aprendizaje</p>
                    </div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Nombre del aula..." autocomplete="off">
                        <button id="btnSearch" class="search-btn">
                            <img src="icons/bx-search.svg" alt="Buscar">
                        </button>
                    </div>
                </div>

                <div class="card-container">
                    <div class="table-actions">
                        <button id="btnNuevaAula" class="btn-primary">
                            <span class="plus-icon">+</span> Nuevo
                        </button>
                        <div class="action-group-right">
                            <button id="btnAsignarRecurso" class="btn-secondary">
                                <img src="icons/bx-link.svg" alt="" class="btn-icon">
                                <span>Asignar Recurso</span>
                            </button>
                            <button id="btnAsignarTest" class="btn-secondary">
                                <img src="icons/bx-link.svg" alt="" class="btn-icon">
                                <span>Asignar Test</span>
                            </button>
                            <button id="btnEliminar" class="btn-danger-outline">
                                <img src="icons/bx-trash-alt.svg" alt="" class="btn-icon">
                                <span>Eliminar</span>
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="col-checkbox"><input type="checkbox" id="selectAllCheckbox"></th>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th class="text-center">Estudiantes</th>
                                    <th class="text-center">Recursos</th>
                                    <th class="text-center">Evaluaciones</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="aulasTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <footer class="pagination-footer">
                    <div class="pagination-info" id="paginationInfo">Mostrando 0 de 0 aulas existentes</div>
                    <div class="pagination-controls">
                        <button id="btnPrevPage" class="pagination-arrow">&lt;</button>
                        <button id="btnFirstPage" class="page-badge active">1</button>
                        <span class="page-text">de</span>
                        <button id="btnLastPage" class="page-badge-secondary">1</button>
                        <button id="btnNextPage" class="pagination-arrow">&gt;</button>
                        <span class="page-text ml-15">Página</span>
                        <select id="pageSelect" class="page-select"><option value="1">1</option></select>
                        <span class="page-text">de <span id="totalPagesLabel">1</span></span>
                    </div>
                </footer>
            </main>
        </div>
    </div>

    <!-- MODAL CREAR / EDITAR AULA -->
    <div id="aulaModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Nueva Aula</h2>
            <form id="aulaForm">
                <input type="hidden" id="aulaIdInput">
                <div class="form-group">
                    <label for="nombreAulaInput">Nombre del Aula</label>
                    <input type="text" id="nombreAulaInput" required placeholder="Ej. 2do Primaria Sección A">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCloseModal">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL ASIGNAR (recursos / tests) -->
    <div id="modalAsignar" class="modal-overlay">
        <div class="modal-card">
            <h2 id="asignarTitulo">Asignar</h2>
            <p id="asignarResumen" class="subtitle" style="margin-bottom:16px;"></p>
            <div class="form-group">
                <label for="asignarInput" id="asignarLabel">Buscar</label>
                <input type="text" id="asignarInput" list="asignarDatalist" autocomplete="off" placeholder="Escribe para filtrar y elige de la lista...">
                <datalist id="asignarDatalist"></datalist>
            </div>
            <div id="asignarChips" class="chips-box"></div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btnCancelarAsignar">Cancelar</button>
                <button type="button" class="btn-primary" id="btnConfirmarAsignar" disabled>Asignar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/aulas.js"></script>
</body>
</html>
